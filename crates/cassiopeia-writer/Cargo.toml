[package]
name = "cassiopeia-writer"
description = "Emits NGSI-LD entities to files or a Context Broker for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ahash = "0.8.12"
bytes = "1.12.1"
cassiopeia-common.workspace = true
cassiopeia-diagnostic.workspace = true
cassiopeia-ngsi-ld.workspace = true
cassiopeia-reporter.workspace = true
crossbeam-channel = "0.5.17"
getset = "0.1.7"
http = "1.5.0"
indexmap = "2.14.2"
iri-rs = { version = "3.4.1", features = ["serde", "static"] }
memchr = "2.8.3"
parking_lot = "0.12.5"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-jsonlines = "0.7.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sonic-rs = "0.5.8"
tempfile = "3.27.0"
thiserror = "2.0.20"
url = "2.5.8"
urn-rs = { version = "0.9.2", features = ["serde"] }

[dev-dependencies]
cassiopeia-geometry.workspace = true
chrono = "0.4.45"
execution-time = "0.3.1"

[lints]
workspace = true
