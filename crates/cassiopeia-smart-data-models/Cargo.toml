[package]
name = "cassiopeia-smart-data-models"
description = "The Smart Data Models catalog: downloading, storing, searching, and dereferencing the JSON Schemas entities are validated against"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-common.workspace = true
cassiopeia-ngsi-ld.workspace = true
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["deref", "display"] }
fst = "0.4.7"
futures = "0.3.34"
lazy-regex = "3.6.1"
mediatype = "0.23.0"
reqwest = { version = "0.13.5", features = ["json"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3.23.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
