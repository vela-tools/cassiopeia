[package]
name = "cassiopeia-csv-dialect"
description = "The CSV dialect: the parameters a CSV file is parsed with, how a file is opened under them, and what a manifest may state of them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
csv = "1.4.0"
csv-core = "0.1.13"
derive_more = { version = "2.1.1", features = ["as_ref", "display", "into"] }
encoding_rs = "0.8.42"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.154"

[lints]
workspace = true
