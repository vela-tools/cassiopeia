[package]
name = "cassiopeia-tui"
description = "Terminal user interface for exploring Smart Data Model schemas and authoring Cassiopeia mappings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-mapping.workspace = true
cassiopeia-ngsi-ld.workspace = true
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_more = { version = "2.1.1", features = ["display"] }
getset = "0.1.7"
indexmap = { version = "2.14.2", features = ["serde"] }
inflections = "1.1.1"
langtag = { version = "1.1.0", features = ["serde"] }
ratatui = { version = "0.30.2", features = ["all-widgets", "serde"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
tui-tree-widget = "0.24.1"

[lints]
workspace = true
