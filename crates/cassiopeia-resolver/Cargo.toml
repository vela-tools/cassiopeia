[package]
name = "cassiopeia-resolver"
description = "Sinks fragments into stores and assembles NGSI-LD entities for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ahash = "0.8.12"
cassiopeia-common.workspace = true
cassiopeia-ir.workspace = true
cassiopeia-mapping.workspace = true
cassiopeia-ngsi-ld.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["display"] }
foldhash = "0.2.0"
indexmap = "2.14.2"
rayon = "1.12.0"
redb = "4.4.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
smallvec = "1.16.4"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
urn-rs = { version = "0.9.2", features = ["exact-eq"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
