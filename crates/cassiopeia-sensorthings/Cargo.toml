[package]
name = "cassiopeia-sensorthings"
description = "The OGC SensorThings API vocabulary Cassiopeia shares across its stages: service roots, read settings, requests and pages, entity ids, cursor names, units of measurement, phenomenon times, the readings a server offers and the snapshot file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-unit-notation.workspace = true
cefact-units = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
getset = "0.1.7"
humantime = "2.4.0"
humantime-serde = "1.1.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
