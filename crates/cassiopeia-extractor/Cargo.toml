[package]
name = "cassiopeia-extractor"
description = "Resolves a mapping's attributes into NGSI-LD values for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-batch-sink.workspace = true
cassiopeia-common.workspace = true
cassiopeia-geometry.workspace = true
cassiopeia-ir.workspace = true
cassiopeia-mapping.workspace = true
cassiopeia-ngsi-ld.workspace = true
cassiopeia-unreadable-timestamps.workspace = true
cassiopeia-unresolved-templates.workspace = true
compact_str = "0.10.0"
derive_more = { version = "2.1.1", features = ["deref", "display", "from", "into"] }
iri-rs = "4.1.1"
langtag = "1.1.0"
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
smallvec = "1.16.5"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
urn-rs = "0.9.2"

[dev-dependencies]
cassiopeia-expander.workspace = true
pretty_assertions = "1.4.1"

[lints]
workspace = true
