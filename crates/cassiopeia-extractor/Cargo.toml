[package]
name = "cassiopeia-extractor"
description = "Resolves a mapping's attributes into NGSI-LD values for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-common.workspace = true
cassiopeia-geometry.workspace = true
cassiopeia-ir.workspace = true
cassiopeia-mapping.workspace = true
cassiopeia-ngsi-ld.workspace = true
cassiopeia-unreadable-timestamps.workspace = true
compact_str = "0.10.0"
derive_more = { version = "2.1.1", features = ["display", "from"] }
indexmap = { version = "2.14.2", features = ["serde"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smallvec = "1.16.1"
thiserror = "2.0.20"
urn-rs = "0.9.2"

[dev-dependencies]
cassiopeia-expander.workspace = true
chrono = "0.4.45"

[lints]
workspace = true
