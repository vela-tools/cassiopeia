[package]
name = "cassiopeia-vex-generator"
description = "Generates the OpenVEX document of the Cassiopeia image from the advisories deny.toml ignores and the rulings on them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cargo-lock = "11.1.0"
clap = { version = "4.6.10", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
jiff = { version = "1.0.3", features = ["serde"] }
packageurl = "0.7.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.25.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.3"
url = { version = "2.5.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
