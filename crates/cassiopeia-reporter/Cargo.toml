[package]
name = "cassiopeia-reporter"
description = "Unified logging and progress reporting across terminal and tracing backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anstyle = "1.0.14"
cassiopeia-common.workspace = true
cassiopeia-diagnostic.workspace = true
cassiopeia-directories.workspace = true
cassiopeia-terminal-style.workspace = true
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from"] }
execution-time = "0.3.1"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
num-traits = "0.2.19"
once_cell = "1.21.4"
parking_lot = "0.12.5"
smart-default = "0.7.1"
tabular = "0.2.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "formatting", "local-offset"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-dedup = "0.1.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time"] }

[dev-dependencies]
http = "1.5.0"
iri-rs = "3.4.1"
url = "2.5.8"

[lints]
workspace = true
