[package]
name = "cassiopeia-sensorthings-cursor"
description = "The cursor store of incremental SensorThings reads: the read position of each data stream, kept across runs in one redb database per cursor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-sensorthings.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display", "from", "into", "into_iterator"] }
getset = "0.1.7"
redb = "4.5.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints]
workspace = true
