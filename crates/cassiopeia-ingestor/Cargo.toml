[package]
name = "cassiopeia-ingestor"
description = "Parses source formats into records for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = { version = "0.23.1", optional = true }
bytecount = "0.6.9"
calendrical_calculations = "0.2.4"
cassiopeia-common.workspace = true
cassiopeia-crs.workspace = true
cassiopeia-csv-column.workspace = true
cassiopeia-csv-dialect.workspace = true
cassiopeia-data-profiler.workspace = true
cassiopeia-ir.workspace = true
convert_case = "0.12.0"
csv = "1.4.0"
dbase = { version = "0.8.0", features = ["encoding_rs", "yore"] }
derive_more = { version = "2.1.1", features = ["debug", "display", "from", "into_iterator"] }
eccodes = { version = "2.50.0", optional = true }
encoding_rs = "0.8.44"
encoding_rs_rw = "0.4.3"
geo-types = "0.7.20"
geojson = "1.0.0"
geopackage = { version = "0.14.3", features = ["bundled"], optional = true }
grib = { version = "0.20.3", default-features = false, features = ["ccsds-unpack-with-rust-aec", "jpeg2000-unpack-with-hayro", "png-unpack-with-png-crate", "time-calculation"] }
indexmap = "2.14.2"
kml = { version = "0.15.0", features = ["geo-types"] }
ndarray = "0.17.2"
netcdf-core = "0.12.1"
netcdf-reader = { version = "0.12.1", default-features = false, features = ["cf", "netcdf4"] }
num-traits = "0.2.19"
parking_lot = "0.13.0"
quick-xml = { version = "0.42.0", features = ["encoding"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shapefile = { version = "0.9.0", features = ["encoding_rs", "geo-types", "yore"] }
simd-json = { version = "0.19.0", features = ["beef"] }
strum = { version = "0.28.0", features = ["derive"] }
temp-dir = "0.2.0"
thiserror = "2.0.21"
tracing = "0.1.44"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
zmij = "1.0.23"

[features]
default = ["geopackage", "grib1", "grib2-full"]
geopackage = ["dep:base64", "dep:geopackage"]
grib1 = ["dep:eccodes"]
grib2-full = ["dep:eccodes"]

[dev-dependencies]
cassiopeia-data-profiler.workspace = true
cassiopeia-encoding-detection.workspace = true
geopackage-core = "0.14.3"
grib-core = "0.8.0"
grib-writer = "0.8.0"
mediatype = "0.23.0"
netcdf-writer = "0.12.1"
pretty_assertions = "1.4.1"
temp-dir = "0.2.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
