[package]
name = "cassiopeia-configuration"
description = "The layered runtime configuration of a Cassiopeia installation: built-in defaults, a TOML file, the environment, and per-invocation overrides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-common.workspace = true
cassiopeia-directories.workspace = true
figment2 = { version = "0.11.5", features = ["toml"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
smart-default = "0.7.1"
thiserror = "2.0.20"

[dev-dependencies]
serial_test = "4.0.1"
temp-env = "0.3.6"
tempfile = "3.27.0"
toml = "1.1.5"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lints]
workspace = true
