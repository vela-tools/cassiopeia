[package]
name = "cassiopeia-data-profiler"
description = "Detects the source format of a file or byte buffer by parsing and validating its content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytecount = "0.6.9"
cassiopeia-common.workspace = true
cassiopeia-csv-dialect.workspace = true
cassiopeia-encoding-detection.workspace = true
cassiopeia-sensorthings.workspace = true
csv = "1.4.0"
encoding_rs = { version = "0.8.44", features = ["alloc"] }
getset = "0.1.7"
lazy-regex = "3.6.2"
mediatype = { version = "0.23.0", features = ["serde"] }
memmap2 = "0.9.12"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
zip = { version = "9.5.1", default-features = false, features = ["bzip2", "deflate", "time", "zstd"] }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
