[package]
name = "cassiopeia-pipeline"
description = "Composition root that wires Cassiopeia's stages into a scheduled, back-pressured run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-aggregator.workspace = true
cassiopeia-collector.workspace = true
cassiopeia-common.workspace = true
cassiopeia-diagnostic.workspace = true
cassiopeia-expander.workspace = true
cassiopeia-extractor.workspace = true
cassiopeia-geometry.workspace = true
cassiopeia-ingestor.workspace = true
cassiopeia-ir.workspace = true
cassiopeia-manifest.workspace = true
cassiopeia-mapping.workspace = true
cassiopeia-ngsi-ld.workspace = true
cassiopeia-profiler.workspace = true
cassiopeia-reporter.workspace = true
cassiopeia-resolver.workspace = true
cassiopeia-scheduler.workspace = true
cassiopeia-smart-data-models.workspace = true
cassiopeia-transformer.workspace = true
cassiopeia-unreadable-timestamps.workspace = true
cassiopeia-validator.workspace = true
cassiopeia-writer.workspace = true
chrono = "0.4.45"
execution-time = "0.3.1"
indexmap = "2.14.2"
memory-stats = "1.2.0"
serde_json = "1.0.151"
temp-dir = "0.2.0"
thiserror = "2.0.20"
url = "2.5.8"
urn-rs = "0.9.2"

[dev-dependencies]
jsonschema = "0.55.0"
tempfile = "3.27.0"

[features]
default = ["grib1", "grib2-full"]
grib1 = ["cassiopeia-ingestor/grib1"]
grib2-full = ["cassiopeia-ingestor/grib2-full"]

[lints]
workspace = true
