[package]
name = "cassiopeia-collector"
description = "Data transport for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-common.workspace = true
cassiopeia-encoding-detection.workspace = true
cassiopeia-ir.workspace = true
derive_more = { version = "2.1.1", features = ["display"] }
getset = "0.1.7"
http = "1.5.0"
mediatype = "0.23.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
temp-dir = "0.2.0"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
mockito = { version = "1.7.2", default-features = false }
pretty_assertions = "1.4.1"
secrecy = "0.10.3"
tempfile = "3.27.0"

[lints]
workspace = true
