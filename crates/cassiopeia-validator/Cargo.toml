[package]
name = "cassiopeia-validator"
description = "Checks NGSI-LD entities against JSON Schema for the Cassiopeia pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cassiopeia-common.workspace = true
cassiopeia-diagnostic.workspace = true
cassiopeia-ngsi-ld.workspace = true
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["as_ref", "display", "from"] }
getset = "0.1.7"
foldhash = "0.2.0"
jsonschema = "0.60.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }
simd-json = { version = "0.19.0", features = ["beef"] }
thiserror = "2.0.21"
urn-rs = { version = "0.9.2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints]
workspace = true
