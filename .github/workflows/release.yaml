name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-alpha[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64-gnu
            ext: ""
            archive: tar.xz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64-gnu
            ext: ""
            archive: tar.xz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            ext: ""
            archive: tar.xz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64-musl
            ext: ""
            archive: tar.xz
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
            archive: tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --no-default-features --bin cassiopeia --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="cassiopeia${{ matrix.ext }}"
          stage="cassiopeia-${{ matrix.platform }}"
          asset="${stage}.${{ matrix.archive }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/${bin}" "$stage/"
          tar -cJf "$asset" -C "$stage" "$bin"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "cassiopeia${{ matrix.ext }}"
          $stage = "cassiopeia-${{ matrix.platform }}"
          $asset = "$stage.${{ matrix.archive }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$bin" "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            cassiopeia-${{ matrix.platform }}.${{ matrix.archive }}
            cassiopeia-${{ matrix.platform }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c cassiopeia-*.sha256

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "makeLatest=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "makeLatest=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release body
        env:
          NOTES: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          printf '%s\n\n' "$NOTES" > release-body.md
          {
            echo "## Artifacts"
            echo
            echo "| File | Platform | SHA256 |"
            echo "| --- | --- | --- |"
          } >> release-body.md
          for archive in dist/cassiopeia-*.tar.xz dist/cassiopeia-*.zip; do
            name="$(basename "$archive")"
            slug="${name#cassiopeia-}"
            slug="${slug%%.*}"
            IFS=- read -r os arch libc <<< "$slug"
            case "$os" in
              linux) os_label="Linux" ;;
              macos) os_label="macOS" ;;
              windows) os_label="Windows" ;;
              *) echo "no operating system label for ${name}" >&2; exit 1 ;;
            esac
            case "$arch" in
              x86_64) arch_label="x64" ;;
              aarch64) arch_label="ARM64" ;;
              *) echo "no architecture label for ${name}" >&2; exit 1 ;;
            esac
            case "$libc" in
              "") libc_label="" ;;
              gnu) libc_label="glibc " ;;
              musl) libc_label="musl " ;;
              *) echo "no C library label for ${name}" >&2; exit 1 ;;
            esac
            read -r digest _ < "${archive}.sha256"
            printf '| `%s` | %s %s%s | `%s` |\n' \
              "$name" "$arch_label" "$libc_label" "$os_label" "$digest" >> release-body.md
          done

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/cassiopeia-*"
          allowUpdates: true
          artifactErrorsFailBuild: true
          draft: false
          makeLatest: ${{ steps.release_type.outputs.makeLatest }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          name: ${{ github.ref_name }}
          bodyFile: release-body.md
          token: ${{ secrets.GITHUB_TOKEN }}
