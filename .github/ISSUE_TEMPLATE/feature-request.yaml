name: Feature request
description: A capability Cassiopeia lacks, such as a source format, a mapping key, a template filter, a setting or a command.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Follow the [Cassiopeia security policy](https://github.com/vela-tools/cassiopeia/security/policy) instead.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one or more `area:` labels.
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: Where the capability belongs.
      options:
        - Reading a source (a format, a remote source, detection)
        - The mapping or its templates
        - Geometry and coordinates
        - Combining records into entities
        - The entities written, or their delivery to files or a broker
        - Validation and Smart Data Models
        - Manifests, configuration, scheduling or the command line
        - Warnings, errors and the run summary
        - The schema explorer or the mapping wizard
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What you are trying to do with your source data, and what Cassiopeia cannot do today. Describe the need, not just the fix.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: "The visible contract: mapping and manifest keys and their values, command-line options, record and entity shapes, defaults, and the clause or format specification if one defines it."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Optional; triage completes it. One checkbox per observable check: the input or situation, and the result that must hold."
      value: "- [ ] "
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
