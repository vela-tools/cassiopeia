name: Documentation correction
description: A guide or the command-line help is wrong, unclear, or silent on a case.
labels: [docs]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. If the documentation leads users into an insecure configuration, that is a vulnerability: follow the [Cassiopeia security policy](https://github.com/vela-tools/cassiopeia/security/policy) instead.

        Triage adds one or more `area:` labels.
  - type: textarea
    id: passage
    attributes:
      label: Page and passage
      description: The page and the sentence that is wrong or unclear, quoted, or the case no page covers.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct statement
      description: "What the documentation should say, and what it rests on: a clause, Cassiopeia's behaviour, a test. This is the acceptance."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
